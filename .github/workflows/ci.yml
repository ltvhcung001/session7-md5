name: Payment Service CI - Pull Image from GHCR

on:
  push:
    branches:
      - main
      - master
      - Session8-HW4
  pull_request:
    branches:
      - main
      - master
      - Session8-HW4
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  pull_and_verify:
    name: Pull & Verify GHCR Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Run Payment Service Container
        run: |
          # 1. Chuyển đổi tên owner/repo sang chữ thường để bảo đảm hợp lệ chuẩn GHCR
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/payment-service:1.0.0"

          echo "=== 1. Pulling image from GHCR: ${IMAGE} ==="
          docker pull "${IMAGE}"

          echo "=== 2. Starting container in detached mode ==="
          docker run -d --name payment-service-verify -p 8084:8084 "${IMAGE}"

          echo "=== 3. Waiting for container initialization ==="
          sleep 6

          echo "=== 4. Checking container status ==="
          docker ps --filter "name=payment-service-verify"

          echo "=== 5. Verifying health endpoint ==="
          curl -f http://localhost:8084/api/v1/payments/health

          echo ""
          echo "=== Verification Succeeded: Image pulled and container verified successfully! ==="

      - name: Stop and Cleanup Container
        if: always()
        run: |
          docker stop payment-service-verify || true
          docker rm payment-service-verify || true
