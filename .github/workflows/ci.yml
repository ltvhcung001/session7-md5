name: Payment Service CI

on:
  push:
    branches:
      - main
      - master
      - Session8-HW1
  pull_request:
    branches:
      - main
      - master
      - Session8-HW1

jobs:
  test_job:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew test

  build_job:
    name: Build & Package Artifact
    needs: test_job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build JAR Package
        run: ./gradlew bootJar -x test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-artifact
          path: build/libs/*.jar
          retention-days: 3

  docker_job:
    name: Docker DooD Build & Verification
    needs: build_job
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker Daemon Connection (DooD)
        run: |
          echo "=== 1. Checking Docker Daemon via DooD Socket ==="
          docker info
          docker version

      - name: Build Payment Service Docker Image
        run: |
          echo "=== 2. Testing Docker Build via DooD Socket ==="
          docker build -t quickbite-payment-service:latest -f payment-service/Dockerfile .

      - name: Verify Built Docker Image
        run: |
          echo "=== 3. Verifying Docker Images on Host Daemon ==="
          docker images | grep quickbite-payment-service
